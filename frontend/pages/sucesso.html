<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioTeca - Cadastro Concluído</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
    <div class="auth-card text-center" style="max-width: 480px;">
      
      <!-- Success Icon -->
      <div class="success-icon-wrapper mb-4">
        <i class="bi bi-check-lg"></i>
      </div>

      <!-- Header -->
      <p class="text-primary-custom fw-bold small mb-2" style="letter-spacing: 1px;">CADASTRO CONCLUÍDO</p>
      <h2 class="fw-bold text-dark mb-2">Bem-vindo à BiblioTeca,<br><span class="text-primary-custom fst-italic">Leitor</span>!</h2>
      <p class="text-muted mb-4">Sua conta foi criada com sucesso.</p>

      <!-- Divider -->
      <div class="custom-divider mb-4">
        <i class="bi bi-diamond-fill"></i>
      </div>

      <!-- Info Boxes -->
      <div class="info-box text-start">
        <i class="bi bi-person-badge"></i>
        <span class="text-muted small">Conta criada como <strong class="text-dark">Leitor</strong></span>
      </div>
      
      <div class="info-box text-start">
        <i class="bi bi-shield-check"></i>
        <span class="text-muted small">Dados protegidos conforme a <strong class="text-dark">LGPD</strong></span>
      </div>
      
      <div class="info-box text-start mb-4">
        <i class="bi bi-unlock"></i>
        <span class="text-muted small">Faça login para acessar o sistema</span>
      </div>

      <!-- Actions -->
      <a href="login.html" class="btn btn-primary-custom w-100 py-2 mb-4 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i> Fazer login e entrar
      </a>

      <a href="index.html" class="text-muted text-decoration-none small d-inline-flex align-items-center gap-1 hover-primary">
        <i class="bi bi-arrow-left"></i> Voltar para a página inicial
      </a>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
