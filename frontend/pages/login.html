<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioTeca - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Navbar Minimal -->
  <nav class="navbar navbar-light bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-dark d-flex align-items-center" href="index.html">
        <i class="bi bi-book me-2 text-primary-custom"></i> BiblioTeca
      </a>
    </div>
  </nav>

  <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-journal-bookmark-fill fs-1 text-primary-custom"></i>
        <h2 class="fw-bold mt-2">Bem-vindo de volta</h2>
        <p class="text-muted">Acesse sua conta de leitor</p>
      </div>

      <div id="alertMessage" class="alert d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control bg-light" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <div class="input-group">
            <input type="password" class="form-control bg-light border-end-0" id="senha" placeholder="••••••••" required>
            <span class="input-group-text bg-light cursor-pointer" id="togglePassword" style="cursor: pointer;">
              <i class="bi bi-eye"></i>
            </span>
          </div>
          <div class="mt-2">
            <a href="#" class="text-primary-custom text-decoration-none small">Esqueci minha senha</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3" id="loginBtn">
          Entrar
        </button>
        <div class="text-center">
          <span class="text-muted small">Não tem conta?</span>
          <a href="cadastro.html" class="text-primary-custom text-decoration-none small fw-semibold">Cadastre-se</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
